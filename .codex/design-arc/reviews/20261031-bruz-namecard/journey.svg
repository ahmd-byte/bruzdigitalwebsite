<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120"><defs><style>text{font-family:'DejaVu Sans',Arial,sans-serif;fill:#10243A}.ey{font-size:13px;font-weight:bold;letter-spacing:1.7px}.body{font-size:17px}.small{font-size:14px}.card{font-size:21px;font-weight:700}</style></defs><rect width="1600" height="1120" fill="#F3F7FB"/><text x="72" y="76" class="ey" fill="#163B8C">BRUZ DIGITAL · FULL JOURNEY</text><text x="72" y="137" font-size="46" font-weight="700">From a shared card to a clear conversation.</text><text x="72" y="177" class="body" fill="#475569">One compact homepage, with deeper sections for customers who want more detail.</text>
<!-- flow -->
<g><rect x="72" y="225" width="210" height="102" rx="16" fill="#FFFFFF" stroke="#CBD7E4"/><text x="96" y="263" class="ey" fill="#163B8C">ENTRY</text><text x="96" y="296" class="card">Card / QR</text><rect x="334" y="225" width="280" height="102" rx="16" fill="#163B8C"/><text x="358" y="263" class="ey" fill="#16B8C4">HOME</text><text x="358" y="296" class="card" fill="#FFFFFF" style="fill:#FFFFFF">Bruz at a glance</text><rect x="666" y="225" width="392" height="102" rx="16" fill="#FFFFFF" stroke="#CBD7E4"/><text x="690" y="263" class="ey" fill="#163B8C">EXPLORE</text><text x="690" y="296" class="card">Studio · Work · Products · Team</text><rect x="1110" y="225" width="418" height="102" rx="16" fill="#E8F4F7" stroke="#B9DDE1"/><text x="1134" y="263" class="ey" fill="#163B8C">CONTACT</text><text x="1134" y="296" class="card">WhatsApp* / email</text><path d="M282 276h44M614 276h44M1058 276h44" stroke="#16B8C4" stroke-width="4"/><path d="M318 267l10 9-10 9M650 267l10 9-10 9M1094 267l10 9-10 9" fill="none" stroke="#16B8C4" stroke-width="3"/></g>
<!-- four cards -->
<text x="72" y="399" class="ey" fill="#163B8C">HOMEPAGE SECTIONS</text>
<rect x="72" y="428" width="354" height="234" rx="18" fill="#FFFFFF" stroke="#D6E1EC"/><text x="100" y="474" class="ey" fill="#163B8C">01 · STUDIO</text><text x="100" y="517" class="card">Services + approach</text><text x="100" y="556" class="small" fill="#475569">Custom software, applied AI, web</text><text x="100" y="580" class="small" fill="#475569">and product systems. Understand →</text><text x="100" y="604" class="small" fill="#475569">Shape → Build → Hand over.</text><text x="100" y="640" class="small" font-weight="700" fill="#163B8C">No new service claims.</text>
<rect x="450" y="428" width="354" height="234" rx="18" fill="#FFFFFF" stroke="#D6E1EC"/><text x="478" y="474" class="ey" fill="#163B8C">02 · WORK</text><text x="478" y="517" class="card">Quality Control Tower</text><text x="478" y="556" class="small" fill="#475569">Hackathon prototype. Capture →</text><text x="478" y="580" class="small" fill="#475569">review → act. Interface marked</text><text x="478" y="604" class="small" fill="#475569">as illustrative, not deployed.</text><text x="478" y="640" class="small" font-weight="700" fill="#163B8C">2nd runner-up · 2026.</text>
<rect x="828" y="428" width="354" height="234" rx="18" fill="#FFFFFF" stroke="#D6E1EC"/><text x="856" y="474" class="ey" fill="#163B8C">03 · PRODUCTS</text><text x="856" y="517" class="card">Status is visible</text><text x="856" y="556" class="small" fill="#475569">Tower · prototype</text><text x="856" y="580" class="small" fill="#475569">OCR · ingestion + image quality built</text><text x="856" y="604" class="small" fill="#475569">Intelligent · in development</text><text x="856" y="640" class="small" font-weight="700" fill="#163B8C">No implied production claims.</text>
<rect x="1206" y="428" width="322" height="234" rx="18" fill="#FFFFFF" stroke="#D6E1EC"/><text x="1234" y="474" class="ey" fill="#163B8C">04 · TEAM</text><text x="1234" y="517" class="card">Five verified people</text><text x="1234" y="556" class="small" fill="#475569">Use supplied portraits for</text><text x="1234" y="580" class="small" fill="#475569">Sarvind + Nabilah; initials</text><text x="1234" y="604" class="small" fill="#475569">for remaining three.</text><text x="1234" y="640" class="small" font-weight="700" fill="#163B8C">Names + roles only.</text>
<!-- states -->
<text x="72" y="730" class="ey" fill="#163B8C">INTERACTION + RECOVERY STATES</text>
<rect x="72" y="760" width="454" height="242" rx="18" fill="#10243A"/><text x="100" y="807" class="ey" fill="#16B8C4">NAV</text><text x="100" y="850" class="card" fill="#FFFFFF" style="fill:#FFFFFF">Closed ↔ open</text><text x="100" y="890" class="small" fill="#D8E4F0" style="fill:#D8E4F0">Keyboard focus stays visible; Escape</text><text x="100" y="915" class="small" fill="#D8E4F0" style="fill:#D8E4F0">or close control returns to page.</text><text x="100" y="960" class="small" fill="#D8E4F0" style="fill:#D8E4F0">Anchor links use reduced-motion-aware scroll.</text>
<rect x="553" y="760" width="454" height="242" rx="18" fill="#FFFFFF" stroke="#D6E1EC"/><text x="581" y="807" class="ey" fill="#163B8C">CONTACT</text><text x="581" y="850" class="card">WhatsApp preferred*</text><text x="581" y="890" class="small" fill="#475569">Use verified central number when provided.</text><text x="581" y="915" class="small" fill="#475569">Keep hello@bruzdigital.com visible as</text><text x="581" y="940" class="small" fill="#475569">fallback; if email app doesn't open, copy it.</text><text x="581" y="980" class="small" font-weight="700" fill="#163B8C">No form until host delivery is confirmed.</text>
<rect x="1034" y="760" width="494" height="242" rx="18" fill="#FFFFFF" stroke="#D6E1EC"/><text x="1062" y="807" class="ey" fill="#163B8C">UTILITY ROUTES</text><text x="1062" y="850" class="card">Privacy + not found</text><text x="1062" y="890" class="small" fill="#475569">Privacy remains available from footer.</text><text x="1062" y="915" class="small" fill="#475569">404 links back to Home, Work and Contact.</text><text x="1062" y="955" class="small" fill="#475569">Static pages have no app loading/empty state.</text><text x="1062" y="980" class="small" font-weight="700" fill="#163B8C">*WhatsApp number still needs confirmation.</text>
<text x="72" y="1068" class="small" fill="#64748B">Guideline constraint: visible keyboard focus, accessible labels, and WCAG target sizing. Visual appearance alone does not establish compliance.</text></svg>