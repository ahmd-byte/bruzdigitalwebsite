name: Site quality

on:
  pull_request:
  push:
    branches:
      - ahmad-branch

jobs:
  production-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build production package
        run: python tools/build_production.py
      - name: Audit production package
        run: python tools/audit_production.py
